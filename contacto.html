<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Lo quieres, te lo vendo</title>
    
    <!-- CDN Materialize CSS e Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <h1 style="font-family: Arial; font-size: 10px;" class="p-2">Lo quieres, te lo vendo</h1>

    <!-- Menú -->
    <nav class="blue">
        <div class="nav-wrapper container">
            <a href="index.html" class="brand-logo">Inicio</a>
            <a href="#" data-target="mobile-menu" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="index.html">Home</a></li>
                <li class="active"><a href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="mobile-menu">
        <li><a href="index.html">Home</a></li>
        <li class="active"><a href="contacto.html">Contacto</a></li>
    </ul>

    <!-- Formulario de Contacto -->
    <main class="container section">
        <h2 class="center-align">Contáctanos</h2>
        <div class="row">
            <form class="col s12 m8 offset-m4 l6 offset-l3">
                <!-- Campo Nombre -->
                <div class="input-field col s12">
                    <input id="nombre" type="text" class="validate">
                    <label for="nombre">Nombre</label>
                </div>
                
                <!-- Campo Correo -->
                <div class="input-field col s12">
                    <input id="email" type="email" class="validate">
                    <label for="email">Correo electrónico</label>
                </div>

                <!-- Campo Mensaje -->
                <div class="input-field col s12">
                    <textarea id="mensaje" class="materialize-textarea"></textarea>
                    <label for="mensaje">Mensaje</label>
                </div>

                <!-- Botón de Envío -->
                <button class="btn waves-effect waves-light blue col s12" type="submit">
                    Enviar pedido / consulta
                </button>
            </form>
        </div>
    </main>

    <footer>
        <p class="mb-0">Equipo Innovación Digital - 2026</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var elems = document.querySelectorAll('.sidenav');
            M.Sidenav.init(elems);
        });
    </script>
</body>
</html>
